<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>PR Rep Application</title>
        <link href="style.css" rel="stylesheet"/>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link
            href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
            rel="stylesheet">
    </head>
    <body>
        <header>
            <h1>Hippie Goth Stickers</h1>
            <p>Share the stickers you love and earn rewards for every post.</p>
        </header>
        <main>
            <h2>Apply to be a PR rep</h2>
            <form action="apply.php" method="post">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
                <label for="instagram">Instagram</label>
                <input type="text" id="instagram" name="instagram" placeholder="@yourhandle">
                <button type="submit">Apply</button>
            </form>
        </main>
    </body>
