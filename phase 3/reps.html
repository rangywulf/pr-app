<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reps | Shiver</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">

    <!-- Bootstrap Icons (social media logos in the side panel) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />

    <!-- Site styles -->
    <link href="css/brand.css" rel="stylesheet" />
    <link href="css/layout.css" rel="stylesheet" />
    <link href="css/components.css" rel="stylesheet" />

    <!-- Scripts -->
    <script src="js/data.js" defer></script>
    <script src="js/data-access.js" defer></script>
    <script src="js/logic.js" defer></script>
    <script src="js/ui.js" defer></script>
    <script src="js/reps.js" defer></script>
</head>

<body>
    <!-- Top bar: menu button, logo, and shop (same on every page) -->
    <header class="top-bar">
        <button type="button" class="menu-button" id="menu-button" aria-label="Open menu" aria-controls="main-nav"
            aria-expanded="false">&#9776;</button>
        <img src="images/Shiver_Main_Logo_White.png" alt="Shiver" class="logo" />
        <div class="shop-account"><span class="shop-avatar" aria-hidden="true">HG</span><span class="shop-name">Hippie
                Goth Stickers</span></div>
    </header>

    <!-- Sidebar navigation (same on every page) -->
    <nav class="sidebar" id="main-nav" aria-label="Main">
        <a href="index.html" class="nav-link">Overview</a>
        <a href="reps.html" class="nav-link active" aria-current="page">Reps</a>
        <a href="posts.html" class="nav-link">Posts</a>
    </nav>

    <!-- Page content: everything unique to Reps -->
    <main class="page-content">
        <!-- Page title, rep count (filled in by reps.js), and Add rep button -->
        <header class="page-header">
            <div class="page-header-text">
                <h1>Reps</h1>
                <p class="page-subtitle" id="rep-count"></p>
            </div>
            <div class="page-header-actions">
                <button type="button" class="button-link" id="add-rep">Add rep</button>
            </div>
        </header>

        <!-- Filter tabs -->
        <div class="tabs">
            <button type="button" class="tab active" data-status="all">All</button>
            <button type="button" class="tab" data-status="active">Active</button>
            <button type="button" class="tab" data-status="paused">Paused</button>
            <button type="button" class="tab" data-status="invited">Invited</button>
        </div>

        <!-- Search and sort -->
        <div class="toolbar">
            <input type="search" id="rep-search" class="search-input" placeholder="Search reps"
                aria-label="Search reps">
            <select id="rep-sort" class="sort-select" aria-label="Sort reps">
                <option value="name">Sort: Name (A to Z)</option>
                <option value="points">Sort: Most points</option>
            </select>
        </div>

        <!-- Reps table, rows filled in by reps.js -->
        <div class="panel">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Rep</th>
                        <th>Discount code</th>
                        <th>PR code</th>
                        <th>Points</th>
                        <th>Sales</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="reps-table-body">

                </tbody>
            </table>
        </div>

        <!-- Side panel with one rep's details, filled in by reps.js when a row is clicked -->
        <aside class="side-panel" id="rep-panel" aria-label="Rep details">
            <div class="side-panel-header">
                <h2 id="panel-rep-name"></h2>
                <button type="button" class="close-button" id="panel-close" aria-label="Close panel">&#10005;</button>
            </div>
            <a class="panel-email" id="panel-rep-email"></a>
            <span class="badge" id="panel-rep-status"></span>
            <div class="panel-codes">
                <div>
                    <p class="panel-stat-label">Discount code</p>
                    <span class="code" id="panel-discount-code"></span>
                </div>
                <div>
                    <p class="panel-stat-label">PR code</p>
                    <span class="code" id="panel-pr-code"></span>
                </div>
            </div>
            <section class="panel-card">
                <h3 class="panel-section-title">Social media</h3>
                <ul class="panel-list" id="panel-accounts">

                </ul>
            </section>
            <div class="panel-stats panel-card">
                <div class="panel-stat">
                    <p class="panel-stat-label">Balance</p>
                    <p class="panel-stat-value" id="panel-balance"></p>
                </div>
                <div class="panel-stat">
                    <p class="panel-stat-label">Posts</p>
                    <p class="panel-stat-value" id="panel-posts"></p>
                </div>
                <div class="panel-stat">
                    <p class="panel-stat-label">Redeemed</p>
                    <p class="panel-stat-value" id="panel-redeemed"></p>
                </div>
            </div>
            <section class="panel-card">
                <h3 class="panel-section-title">History</h3>
                <ul class="panel-list" id="panel-history">

                </ul>
            </section>
        </aside>

        <!-- Add rep popup -->
        <dialog id="add-rep-modal" class="modal">
            <form id="add-rep-form">
                <h2>Add rep</h2>
                <div class="form-field">
                    <label for="new-rep-name">Name</label>
                    <input type="text" id="new-rep-name" required>
                </div>
                <div class="form-field">
                    <label for="new-rep-email">Email</label>
                    <input type="email" id="new-rep-email" required>
                </div>
                <div class="modal-actions">
                    <button type="button" id="cancel-add-rep" class="button-link button-secondary">Cancel</button>
                    <button type="submit" class="button-link">Save rep</button>
                </div>
            </form>
        </dialog>

        <!-- Toast message in the corner -->
        <div id="toast" class="toast hidden" role="status"></div>
    </main>
</body>

</html>
